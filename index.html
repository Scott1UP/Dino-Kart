<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dino Kart" />
    <meta name="theme-color" content="#2f7fe0" />
    <title>Dino Kart</title>
    <meta
      name="description"
      content="A cheerful dinosaur go-kart racer. Pick your dino, grab items and race to the finish, right in your browser."
    />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Link previews. %SITE_URL% is filled in by the build (see vite.config.ts), because
         these have to be full addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dino Kart" />
    <meta property="og:title" content="Dino Kart" />
    <meta
      property="og:description"
      content="A cheerful dinosaur go-kart racer. Pick your dino, grab items and race to the finish, right in your browser."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dino Kart logo: a grinning T-rex driving a red go-kart." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <video id="menu-video" class="hidden" src="./title.mp4" muted loop playsinline preload="auto"></video>
    <div id="ui">
      <div id="hud" class="hidden">
        <div id="lap-box"><small>LAP</small><span id="lap">1/3</span></div>
        <div id="item" class="empty"><div id="item-icon"></div></div>
        <button id="pause-button" class="round" type="button" data-action="pause" aria-label="Pause">
          <i class="bars"></i>
        </button>
        <button id="fire" type="button" aria-label="Use item" disabled><span id="fire-icon"></span></button>
        <div id="place-box"><span id="place">1</span><span id="place-suffix">st</span><span id="place-total">/6</span></div>
        <div id="banner" class="hidden"></div>
      </div>

      <section id="title" class="screen hidden">
        <h1 class="logo"><img src="./logo.png" alt="Dino Kart" width="1200" height="770" draggable="false" /></h1>
        <button class="btn btn-go btn-huge" type="button" data-action="play"><i class="tri"></i>Play</button>
      </section>

      <section id="select" class="screen hidden">
        <h2 id="pick-title" class="heading">Pick your dino!</h2>
        <div id="racers"></div>
        <div id="speed" class="seg" role="group" aria-label="Speed">
          <button type="button" data-cc="125" aria-pressed="true">125cc</button>
          <button type="button" data-cc="150" aria-pressed="false">150cc</button>
          <button type="button" data-cc="200" aria-pressed="false">200cc</button>
        </div>
        <button id="go" class="btn btn-go btn-huge go-button" type="button"><i class="tri"></i>Go!</button>
      </section>

      <section id="tracks" class="screen hidden">
        <button id="tracks-back" class="round" type="button" data-action="tracks-back" aria-label="Back to dinos">
          <i class="back-arrow"></i>
        </button>
        <h2 id="track-title" class="heading">Pick a track!</h2>
        <div id="track-list"></div>
        <button id="go-track" class="btn btn-go btn-huge go-button" type="button"><i class="tri"></i>Go!</button>
      </section>

      <section id="finish" class="overlay hidden">
        <div id="confetti" aria-hidden="true"></div>
        <div class="panel menu">
          <h2 id="finish-title" class="heading small">Finish!</h2>
          <ol id="standings" class="full"></ol>
          <button class="btn btn-go" type="button" data-action="again"><i class="tri"></i>Race again</button>
          <button class="btn btn-alt" type="button" data-action="change">New dino</button>
        </div>
      </section>

      <section id="pause" class="overlay hidden">
        <div class="panel menu">
          <h2 class="heading small">Paused</h2>
          <button class="btn btn-go" type="button" data-action="resume"><i class="tri"></i>Keep racing</button>
          <button class="btn btn-alt" type="button" data-action="change">New dino</button>
          <button class="btn btn-plain" type="button" data-action="settings"><span class="emoji">⚙️</span> Settings</button>
          <button class="btn btn-plain" type="button" data-action="controls"><span class="emoji">🎮</span> Controls</button>
        </div>
      </section>

      <section id="controls" class="overlay hidden">
        <div class="panel menu">
          <h2 class="heading small">Controls</h2>
          <dl id="controls-list" class="full">
            <div class="control">
              <dt>Steer</dt>
              <dd class="touch">Hold the left or right side of the screen</dd>
              <dd class="keys"><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd></dd>
            </div>
            <div class="control">
              <dt>Use item</dt>
              <dd class="touch">Tap the big round button</dd>
              <dd class="touch pic" aria-hidden="true"><span class="mini-fire"><i></i></span></dd>
              <dd class="keys"><kbd>Space</kbd></dd>
            </div>
            <div class="control">
              <dt>Pause</dt>
              <dd class="touch">Tap the pause button</dd>
              <dd class="touch pic" aria-hidden="true"><span class="mini-pause"><i class="bars"></i></span></dd>
              <dd class="keys"><kbd>Esc</kbd></dd>
            </div>
          </dl>
          <button class="btn btn-go full" type="button" data-action="controls-back">OK!</button>
        </div>
      </section>

      <section id="settings" class="overlay hidden">
        <div class="panel menu">
          <h2 class="heading small">Settings</h2>
          <button id="sound" class="btn btn-plain" type="button" data-action="sound" aria-pressed="true"></button>
          <button id="music" class="btn btn-plain" type="button" data-action="music" aria-pressed="true"></button>
          <button id="retro" class="btn btn-plain full" type="button" data-action="retro" aria-pressed="false"></button>
          <button id="easy" class="btn btn-plain full" type="button" data-action="easy" aria-pressed="false"></button>
          <button class="btn btn-go full" type="button" data-action="settings-back">OK!</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
